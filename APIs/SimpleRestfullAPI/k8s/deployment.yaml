apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspnetcore-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aspnetcore-app
  template:
    metadata:
      labels:
        app: aspnetcore-app
    spec:
      containers:
      - name: aspnetcore-app
        image: your-dockerhub-username/your-app-image:latest
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"